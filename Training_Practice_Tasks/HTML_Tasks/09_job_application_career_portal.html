<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application and Career Portal</title>
<style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;color:#222;background:#f4f6fb}
    img{max-width:100%} a{color:inherit} .wrap{max-width:1100px;margin:35px auto;padding:20px}
    body{font-family:Arial,sans-serif;margin:25px;line-height:1.6;color:#222}header,footer{background:#e9efff;padding:20px}main{max-width:900px;margin:25px auto}section,article,form{margin:20px 0;padding:18px;border:1px solid #ddd;border-radius:8px}label{display:inline-block;margin:5px}input,select,textarea{padding:7px;margin:4px}button{padding:10px 18px;cursor:pointer}</style>
</head>
<body>
<header><h1>Career Portal</h1><p>Find your next opportunity.</p></header><main><section><h2>Junior Software Developer</h2><p><b>Company:</b> ABC Technologies</p><p><b>Requirements:</b> Basic Java, HTML, CSS, SQL and problem-solving skills.</p><p><b>Location:</b> Pune</p></section><form onsubmit="event.preventDefault();alert('Application submitted!')"><h2>Apply Now</h2><label>Full name: <input required type="text"></label><br><br><label>Email: <input required type="email"></label><br><br><label>Phone: <input type="tel"></label><br><br><label>Qualification: <input type="text"></label><br><br><label>Upload resume: <input type="file" accept=".pdf,.doc,.docx" required></label><br><br><label>Cover letter:<br><textarea rows="4" cols="45"></textarea></label><br><br><button>Submit Application</button></form></main>
</body>
</html>
