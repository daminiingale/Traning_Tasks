<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Complaint Registration Form</title>
<style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;color:#222;background:#f4f6fb}
    img{max-width:100%} a{color:inherit} .wrap{max-width:1100px;margin:35px auto;padding:20px}
    body{font-family:Arial,sans-serif;margin:25px;line-height:1.6;color:#222}header,footer{background:#e9efff;padding:20px}main{max-width:900px;margin:25px auto}section,article,form{margin:20px 0;padding:18px;border:1px solid #ddd;border-radius:8px}label{display:inline-block;margin:5px}input,select,textarea{padding:7px;margin:4px}button{padding:10px 18px;cursor:pointer}</style>
</head>
<body>
<header><h1>Online Complaint Form</h1><p>Submit your concern using this form.</p></header><main><form onsubmit="event.preventDefault();alert('Complaint submitted!')"><label>Name: <input required type="text"></label><br><br><label>Email: <input required type="email"></label><br><br><label>Complaint category: <select><option>Choose category</option><option>Technical</option><option>Service</option><option>Other</option></select></label><br><br><label>Priority: <input type="radio" name="priority"> Low <input type="radio" name="priority"> Medium <input type="radio" name="priority"> High</label><br><br><label>Description:<br><textarea rows="5" cols="45" required></textarea></label><br><br><label>Attachment: <input type="file"></label><br><br><label>Preferred resolution date: <input type="date"></label><br><br><button>Submit Complaint</button></form></main>
</body>
</html>
