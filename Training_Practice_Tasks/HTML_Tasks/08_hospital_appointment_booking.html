<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Appointment Booking Page</title>
<style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;color:#222;background:#f4f6fb}
    img{max-width:100%} a{color:inherit} .wrap{max-width:1100px;margin:35px auto;padding:20px}
    body{font-family:Arial,sans-serif;margin:25px;line-height:1.6;color:#222}header,footer{background:#e9efff;padding:20px}main{max-width:900px;margin:25px auto}section,article,form{margin:20px 0;padding:18px;border:1px solid #ddd;border-radius:8px}label{display:inline-block;margin:5px}input,select,textarea{padding:7px;margin:4px}button{padding:10px 18px;cursor:pointer}</style>
</head>
<body>
<header><h1>City Care Hospital</h1><p>Book your appointment online.</p></header><main><form onsubmit="event.preventDefault();alert('Appointment request submitted!')"><fieldset><legend>Patient Details</legend><label>Patient name: <input required type="text"></label><br><br><label>Age: <input type="number" min="1" max="120"></label><br><br><label>Phone: <input required type="tel"></label><br><br><label>Email: <input type="email"></label></fieldset><fieldset><legend>Appointment Details</legend><label>Department: <select><option>General Medicine</option><option>Cardiology</option><option>Dermatology</option><option>Orthopedics</option></select></label><br><br><label>Doctor: <select><option>Any available doctor</option><option>Dr. Sharma</option><option>Dr. Patil</option></select></label><br><br><label>Date: <input type="date" required></label><br><br><label>Symptoms / Medical history:<br><textarea rows="4" cols="40"></textarea></label></fieldset><button>Book Appointment</button></form></main>
</body>
</html>
