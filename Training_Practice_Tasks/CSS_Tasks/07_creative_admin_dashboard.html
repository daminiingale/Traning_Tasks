<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Admin Dashboard</title>
<style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;color:#222;background:#f4f6fb}
    img{max-width:100%} a{color:inherit} .wrap{max-width:1100px;margin:35px auto;padding:20px}
    .layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.layout aside{background:#25224a;color:white;padding:25px}.layout aside span{color:#a99cff}.layout aside a{display:block;padding:15px 5px;color:#ddd}.layout main{padding:30px}.layout header{display:flex;justify-content:space-between;align-items:center}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;margin:25px 0}.stats article,.panel{background:white;padding:22px;border-radius:12px;box-shadow:0 5px 20px #0001}.stats h2{color:#5145cd}.stats small{color:green}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:13px;border-bottom:1px solid #eee}@media(max-width:650px){.layout{grid-template-columns:1fr}.layout aside{display:none}}</style>
</head>
<body>

<div class="layout"><aside><h2>Admin<span>Panel</span></h2><a>▦ Dashboard</a><a>♙ Users</a><a>▤ Reports</a><a>⚙ Settings</a></aside><main><header><h1>Dashboard</h1><span>Welcome, Admin</span></header><section class="stats"><article><p>Total Users</p><h2>2,450</h2><small>+12% this month</small></article><article><p>Revenue</p><h2>₹84,500</h2><small>+8% this month</small></article><article><p>Orders</p><h2>680</h2><small>+5% this month</small></article></section><section class="panel"><h2>Recent Activity</h2><table><tr><th>Name</th><th>Activity</th><th>Status</th></tr><tr><td>Aarav</td><td>New registration</td><td>Completed</td></tr><tr><td>Priya</td><td>Updated profile</td><td>Completed</td></tr><tr><td>Rahul</td><td>New order</td><td>Pending</td></tr></table></section></main></div>
</body>
</html>
