<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Showcase Page</title>
<style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;color:#222;background:#f4f6fb}
    img{max-width:100%} a{color:inherit} .wrap{max-width:1100px;margin:35px auto;padding:20px}
    .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}.products article{position:relative;background:white;padding:20px;border-radius:15px;box-shadow:0 7px 25px #0001}.productIcon{height:150px;background:#eef0ff;border-radius:12px;display:grid;place-items:center;font-size:65px}.sale{display:inline-block;margin-top:12px;background:#ffdf99;padding:5px 9px;border-radius:5px;font-size:11px}.products del{color:#888}.products button{display:block;width:100%;margin-top:15px;padding:11px;background:#5145cd;color:white;border:0;border-radius:7px}</style>
</head>
<body>

<main class="wrap"><h1>Everyday essentials</h1><p>Discover products selected for you.</p><div class="products"><article><div class="productIcon">🎧</div><span class="sale">20% OFF</span><h3>Wireless Headphones</h3><p>Comfortable sound for every day.</p><b>₹1,599</b> <del>₹1,999</del><button>Add to Cart</button></article><article><div class="productIcon">⌚</div><span class="sale">NEW</span><h3>Smart Watch</h3><p>Track your day with style.</p><b>₹2,499</b><button>Add to Cart</button></article><article><div class="productIcon">🎒</div><span class="sale">BESTSELLER</span><h3>Travel Backpack</h3><p>Room for all your essentials.</p><b>₹899</b><button>Add to Cart</button></article></div></main>
</body>
</html>
